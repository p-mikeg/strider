[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/*"]
# Phase 4 Task 4.1 — `strider-pattern-macros` is the proc-macro crate
# that emits Rust + PyO3 pattern builders from a single annotated
# struct.  See `crates/strider-pattern-macros/EMISSION_SPEC.md` for the
# emission contract and `crates/strider-py/src/pattern_reference.rs`
# for the hand-written shape it must mirror.


[workspace.package]
edition = "2024"

[workspace.dependencies]
strider = { path = "crates/strider" }
cfg = { path = "crates/cfg" }
reader = { path = "crates/reader" }
target = { path = "crates/target" }
strider-ir = { path = "crates/strider-ir" }
strider-lift = { path = "crates/strider-lift" }
strider-analyze = { path = "crates/strider-analyze" }
strider-pattern-macros = { path = "crates/strider-pattern-macros" }
rsleigh = { path = "../rsleigh" }

cranelift-bitset = "0.112.2"
ethnum = "1.5"
cranelift-entity = "0.112.2"
smallvec = { version = "1.13.2", default-features = false, features = [
    "const_new",
] }
object = "0.38.1"

petgraph = "0.8.3"
thiserror = "2.0.18"
anyhow = "1.0"
itertools = { version = "0.13.0", default-features = false }
expect-test = "1.5.0"

[workspace.lints.clippy]
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
unreachable      = "deny"
todo             = "deny"
redundant_closure = "warn"
map_unwrap_or    = "warn"
match_same_arms  = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"

