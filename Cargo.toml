[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/*"]
# A path dependency under the workspace root is a member by default, which puts
# the vendored rsleigh fork into `--workspace` builds, tests and lints.
exclude = ["externals/rsleigh"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
strider-reader = { path = "crates/strider-reader" }
strider-target = { path = "crates/strider-target" }
dot = { path = "crates/dot" }
entity-utils = { path = "crates/entity-utils" }
graph-algorithms = { path = "crates/graph-algorithms" }
read-only-memory = { path = "crates/read-only-memory" }
strider-cfg = { path = "crates/strider-cfg" }
strider-graph = { path = "crates/strider-graph" }
strider-ir = { path = "crates/strider-ir" }
strider-ir-test-utils = { path = "crates/strider-ir-test-utils" }
strider-lift = { path = "crates/strider-lift" }
strider-opt = { path = "crates/strider-opt" }
strider-orchestrator = { path = "crates/strider-orchestrator" }
strider-pattern = { path = "crates/strider-pattern" }
vn-container = { path = "crates/vn-container" }
rsleigh = { path = "externals/rsleigh" }

cranelift-bitset = "0.112.2"
cranelift-entity = "0.112.2"
smallvec = { version = "1.13.2", default-features = false, features = [
    "const_new",
] }
object = "0.38.1"
memmap2 = "0.9.11"

petgraph = "0.8.3"
rustc-hash = "2"
thiserror = "2.0.18"
anyhow = "1.0"
itertools = { version = "0.13.0", default-features = false }
expect-test = "1.5.0"
proptest = "1.5.0"
# Benchmarks only.  Default features off: drops `rayon` (the workspace is
# single-threaded) and `plotters` (no plot generation needed);
# `cargo_bench_support` is required for the `cargo bench` runner.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[workspace.lints.clippy]
# Panicking on a structural invariant that pre-optimization IR validation
# already guarantees (e.g. a `Store` always having its 3 input slots) is the
# honest, preferred behaviour — a hard crash beats threading a defensive
# `Result` through code that can only fail if the validator is broken. So
# `panic!`/`unwrap`/`expect`/`unreachable!`/direct indexing are permitted; use
# them for invariants, keep `Result` for genuinely-fallible operations (IO,
# parsing, untrusted input).
unwrap_used      = "allow"
expect_used      = "allow"
panic            = "allow"
unreachable      = "allow"
todo             = "deny"
redundant_closure = "warn"
map_unwrap_or    = "warn"
match_same_arms  = "warn"
# Deliberately off: a `# Errors` section that only restates the return type
# ("returns an error when the operation fails") is noise. Where a caller can
# actually act on the failure, say so in the doc body instead.
missing_errors_doc = "allow"

