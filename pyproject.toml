# PEP 639 license fields need maturin >= 1.10.
[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "strider"
version = "0.3.0"
description = "Python bindings for the Strider binary analysis pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD-PARTY.md",
    "licenses/Apache-2.0.txt",
    "licenses/NOTICE-ghidra.txt",
    "licenses/rust-crates.md",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/p-mikeg/strider"

# PEP 735 dev group: uv sync --group dev.
[dependency-groups]
dev = [
    "maturin>=1.10,<2.0",
    "patchelf>=0.17 ; sys_platform == 'linux'",
    "pytest>=7",
    "pyelftools>=0.30",
    "pyright>=1.1.400",
]

# Type-check gate: `uv run pyright` from the workspace root checks the shipped
# package, its tests and its examples against the `.pyi` stubs.
[tool.pyright]
include = [
    "crates/strider-py/strider",
    "crates/strider-py/tests/python",
    "crates/strider-py/examples/python",
]
pythonVersion = "3.9"
# The extension submodules ship .pyi stubs with no .py.
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["crates/strider-py/tests/python"]
norecursedirs = [".git", ".venv", ".worktrees", "target", "__pycache__"]

# The uv project lives at the workspace root; maturin builds crates/strider-py.
[tool.maturin]
manifest-path = "crates/strider-py/Cargo.toml"
python-source = "crates/strider-py"
module-name = "strider._strider"
include = [
    { path = "crates/strider-py/strider/*.pyi", format = "wheel" },
    # `strider/pattern/` is a stub PACKAGE (`__init__.pyi` + `constraints.pyi`)
    # rather than a flat `pattern.pyi`, because a file cannot host a submodule
    # stub.  The glob above is one level deep, so the nested stubs need their
    # own entry or the wheel ships `strider.pattern` untyped.
    { path = "crates/strider-py/strider/pattern/*.pyi", format = "wheel" },
    { path = "crates/strider-py/strider/py.typed", format = "wheel" },
    { path = "crates/strider-py/strider/explore.html", format = "wheel" },
]
