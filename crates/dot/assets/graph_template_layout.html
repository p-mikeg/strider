<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IR Graph Viewer (native layout)</title>
  <style>
    :root { --bg:#141417; --panel:#1e1e22; --border:#2e2e34; --text:#d4d4d8;
            --text2:#8c8c96; --accent:#5b9cf6; --node:#2d2d2d; --nodeb:#888;
            --edge:#aaa; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
                font-family:system-ui,sans-serif; }
    #bar { position:fixed; top:0; left:0; right:0; height:36px; display:flex;
           align-items:center; gap:12px; padding:0 12px; background:var(--panel);
           border-bottom:1px solid var(--border); font-size:13px; z-index:10; }
    #bar button { background:var(--node); color:var(--text); border:1px solid var(--border);
                  border-radius:4px; padding:3px 10px; cursor:pointer; font-size:12px; }
    #bar button:hover { border-color:var(--accent); }
    #bar .stat { color:var(--text2); }
    #wrap { position:fixed; top:36px; left:0; right:0; bottom:0; overflow:hidden; }
    svg { width:100%; height:100%; display:block; }
    .node rect { fill:var(--node); stroke:var(--nodeb); stroke-width:1; }
    .node text { fill:var(--text); font-family:"Courier New",monospace; font-size:11px;
                 white-space:pre; dominant-baseline:hanging; }
    .edge { stroke:var(--edge); stroke-width:1; fill:none; opacity:.55; }
    .node:hover rect { stroke:var(--accent); stroke-width:2; }
  </style>
</head>
<body>
  <div id="bar">
    <b>IR Graph</b>
    <span class="stat" id="stat"></span>
    <button id="bFit">Fit</button>
    <button id="bReset">Reset zoom</button>
  </div>
  <div id="wrap"><svg id="graph"></svg></div>

  <script type="application/json" id="layout-data">__LAYOUT_JSON__</script>
  <script>__SVG_PAN_ZOOM_JS__</script>
  <script>
  (function () {
    const data = JSON.parse(document.getElementById("layout-data").textContent);
    const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    // Split a DOT label into visual lines (real newlines + \l \n \r escapes).
    const lines = (lbl) => lbl.split(/\\[lnr]|\n/).filter((s, i, a) => s.length || i < a.length - 1);

    const parts = [];
    parts.push(
      `<defs><marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="3"` +
      ` orient="auto" markerUnits="userSpaceOnUse">` +
      `<path d="M0,0 L7,3 L0,6 Z" fill="var(--edge)"/></marker></defs>`);

    // Edges first (drawn behind nodes). Each: {p:[[x,y]…], dashed?, color?}.
    // Long-range edges (big vertical span) are faded and thinner so the local
    // node structure reads through the long-live-range "cable" bundles.
    let eg = "";
    for (const e of data.edges) {
      const pts = e.p;
      if (!pts || pts.length < 2) continue;
      const span = Math.abs(pts[pts.length - 1][1] - pts[0][1]);
      const op = span > 4000 ? 0.12 : span > 800 ? 0.3 : 0.7;
      const sw = span > 800 ? 0.6 : 1;
      const d = "M" + pts.map((p) => p[0] + "," + p[1]).join(" L");
      const col = e.color ? `stroke:${e.color};` : "";
      const dash = e.dashed ? ' stroke-dasharray="5,4"' : "";
      eg += `<path class="edge" d="${d}" style="${col}stroke-opacity:${op};stroke-width:${sw}"${dash}` +
        (span > 800 ? "" : ' marker-end="url(#arw)"') + "/>";
    }
    parts.push(`<g id="edges">${eg}</g>`);

    // Nodes — shape + fill/stroke mirror the DOT rendering.
    let ng = "";
    const PAD = 6, LH = 15;
    for (const n of data.nodes) {
      const ls = lines(n.label);
      let tx = "";
      for (let i = 0; i < ls.length; i++) {
        tx += `<tspan x="${n.x + PAD}" y="${n.y + PAD + i * LH}">${esc(ls[i])}</tspan>`;
      }
      const style = `fill:${n.fill || "var(--node)"};stroke:${n.stroke || "var(--nodeb)"}`;
      const x = n.x, y = n.y, w = n.w, h = n.h, mx = x + w / 2, my = y + h / 2;
      const poly = (pts) => `<polygon points="${pts}" style="${style}"/>`;
      let shape;
      switch (n.shape) {
        case "trapezium": {
          const i = w * 0.22;
          shape = poly(`${x + i},${y} ${x + w - i},${y} ${x + w},${y + h} ${x},${y + h}`); break;
        }
        case "invtrapezium": {
          const i = w * 0.22;
          shape = poly(`${x},${y} ${x + w},${y} ${x + w - i},${y + h} ${x + i},${y + h}`); break;
        }
        case "diamond": case "Mdiamond":
          shape = poly(`${mx},${y} ${x + w},${my} ${mx},${y + h} ${x},${my}`); break;
        case "house":
          shape = poly(`${mx},${y} ${x + w},${y + h * 0.4} ${x + w},${y + h} ${x},${y + h} ${x},${y + h * 0.4}`); break;
        case "invhouse":
          shape = poly(`${x},${y} ${x + w},${y} ${x + w},${y + h * 0.6} ${mx},${y + h} ${x},${y + h * 0.6}`); break;
        case "hexagon": {
          const i = w * 0.2;
          shape = poly(`${x + i},${y} ${x + w - i},${y} ${x + w},${my} ${x + w - i},${y + h} ${x + i},${y + h} ${x},${my}`); break;
        }
        case "ellipse": case "oval": case "circle": case "doublecircle":
          shape = `<ellipse cx="${mx}" cy="${my}" rx="${w / 2}" ry="${h / 2}" style="${style}"/>`; break;
        default:
          shape = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" style="${style}"/>`;
      }
      ng += `<g class="node"><title>${esc(n.id)}</title>${shape}<text>${tx}</text></g>`;
    }
    parts.push(`<g id="nodes">${ng}</g>`);

    const svg = document.getElementById("graph");
    svg.setAttribute("viewBox", `0 0 ${data.width.toFixed(0)} ${data.height.toFixed(0)}`);
    // svg-pan-zoom needs a single wrapping <g> it controls; wrap everything.
    svg.innerHTML = `<g id="viewport">${parts.join("")}</g>`;

    document.getElementById("stat").textContent =
      `${data.nodes.length} nodes · ${data.edges.length} edges`;

    const pz = svgPanZoom("#graph", {
      viewportSelector: "#viewport", zoomEnabled: true, panEnabled: true,
      controlIconsEnabled: false, fit: true, center: true, minZoom: 0.02, maxZoom: 50,
    });
    document.getElementById("bFit").onclick = () => { pz.fit(); pz.center(); };
    document.getElementById("bReset").onclick = () => { pz.resetZoom(); pz.center(); };
  })();
  </script>
</body>
</html>
