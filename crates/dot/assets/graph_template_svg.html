<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graph</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #1e1e1e; color: #ddd; overflow: hidden; }
  #wrap { width: 100%; height: 100%; }
  #wrap svg { display: block; width: 100%; height: 100%; }
  #controls {
    position: fixed; top: 10px; right: 12px;
    display: flex; gap: 6px;
    z-index: 10;
  }
  button {
    background: rgba(30,30,30,.85); color: #ddd;
    border: 1px solid #444; border-radius: 6px;
    padding: 5px 11px; cursor: pointer; font-size: 12px;
    backdrop-filter: blur(4px);
  }
  button:hover { background: rgba(60,60,60,.9); }
</style>
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
</head>
<body>
<div id="wrap">__SVG__</div>
<div id="controls">
  <button id="bFit">Fit</button>
  <button id="bIn">＋</button>
  <button id="bOut">－</button>
  <button id="bReset">Reset</button>
</div>
<script>
(function () {
  const svg = document.querySelector('#wrap svg');
  if (!svg) return;
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.style.cssText = 'width:100%;height:100%;display:block;background:transparent;';

  const pz = svgPanZoom(svg, {
    zoomEnabled: true,
    controlIconsEnabled: false,
    fit: true,
    center: true,
    minZoom: 0.005,
    maxZoom: 80,
    zoomScaleSensitivity: 0.2,
  });

  document.getElementById('bFit').onclick   = () => { pz.fit(); pz.center(); };
  document.getElementById('bIn').onclick    = () => pz.zoomBy(1.3);
  document.getElementById('bOut').onclick   = () => pz.zoomBy(0.77);
  document.getElementById('bReset').onclick = () => { pz.resetZoom(); pz.center(); };
})();
</script>
</body>
</html>
