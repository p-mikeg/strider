[package]
name = "strider-pattern-macros"
version = "0.1.0"
edition = { workspace = true }

# Proc-macro crate emitting Rust + PyO3 pattern builders from a single
# annotated struct definition.  See `EMISSION_SPEC.md` for the exact
# emission contract and `crates/strider-py/src/pattern_reference.rs`
# for the hand-written reference shape this macro replicates
# byte-for-byte at the `.pyi` level.
[lib]
proc-macro = true
# Doctests for proc-macros require setting up a full pyo3 + pattern
# crate dependency graph from within `cargo test -p
# strider-pattern-macros`; we test the macro from `strider-py` instead
# (where those deps already live), so disable doctests on this crate.
doctest = false

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[lints]
workspace = true
