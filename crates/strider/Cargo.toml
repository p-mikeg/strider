[package]
name = "strider"
version = "0.1.0"
edition.workspace = true

[dependencies]
rsleigh.workspace = true
anyhow.workspace = true
thiserror.workspace = true
target.workspace = true
strider-ir.workspace = true
cfg.workspace = true
pcode-lift.workspace = true
strider-lift.workspace = true
# Phase 3 Task 3.1c: orchestrator + Strider + indirect_resolve + rewrite
# moved into strider-analyze.  This crate re-exports them from
# strider-analyze so the well-known `strider::*` path keeps working.
strider-analyze.workspace = true
reader.workspace = true
object.workspace = true

[lints]
workspace = true

[dev-dependencies]
expect-test.workspace = true
paste = "1"
strider-ir = { workspace = true, features = ["test-utils"] }
criterion = { version = "0.7", features = ["html_reports"] }
insta = { version = "1.40", features = ["yaml"] }
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "v1_vs_v2"
harness = false