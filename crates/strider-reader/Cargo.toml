[package]
name = "strider-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ELF loading and memory service for the strider pipeline."
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "README.md"

[features]
# Exposes `OwnedElf::regions`, one region set cut by an `elf::LoadFilter`, and
# `LoadFilter` itself to this crate's tests and bench. Off in production, where
# `OwnedElf::image` is the one way to cut an image's fetch and ROM.
test-util = []

[dependencies]
object.workspace = true
memmap2.workspace = true
read-only-memory.workspace = true
rsleigh.workspace = true
anyhow.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
object = { workspace = true, features = ["write"] }
proptest.workspace = true
tempfile = "3.10"
# Self dev-dependency: turns `test-util` on for the `tests/` and `benches/`
# targets only.
strider-reader = { workspace = true, features = ["test-util"] }

[[bench]]
name = "read"
harness = false
