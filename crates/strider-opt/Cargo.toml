[package]
name = "strider-opt"
version = "0.1.0"
edition.workspace = true

[dependencies]
strider-ir = { workspace = true }
strider-pattern = { workspace = true }
strider-target.workspace = true
entity-utils = { workspace = true }
# strider-cfg forward dep: the `indirect_branch_resolve` classifiers
# produce `strider_cfg::ResolvedTargets` to seed the CFG-rebuild feedback
# loop (the type only — the resolver implementation lives in
# strider-orchestrator).
strider-cfg = { workspace = true }
rsleigh.workspace = true
petgraph.workspace = true
anyhow.workspace = true
bitflags = "2"
cranelift-entity.workspace = true
rustc-hash = "2"
smallvec.workspace = true

[dev-dependencies]
strider-ir-test-utils = { workspace = true }
object.workspace = true
# Property-based testing for value-only IR invariants under the optimizer.
proptest = "1"

[lints]
workspace = true
