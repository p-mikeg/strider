[package]
name = "strider-opt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Strider's optimization passes and indirect-branch classifiers."
repository.workspace = true
rust-version.workspace = true

[features]
# Exposes the single-pass test runners (`run_one` / `run_post`) to downstream
# integration tests (they compile against the non-`test` build).  Off in
# production so those test-only helpers stay out of the public surface.
test-util = []

[dependencies]
strider-ir = { workspace = true }
strider-pattern = { workspace = true }
strider-target.workspace = true
entity-utils = { workspace = true }
graph-algorithms = { workspace = true }
# strider-cfg forward dep: the `indirect_branch_resolve` classifiers
# produce `strider_cfg::ResolvedTargets` to seed the CFG-rebuild feedback
# loop (the type only — the resolver implementation lives in
# strider-orchestrator).
strider-cfg = { workspace = true }
rsleigh.workspace = true
vn-container.workspace = true
petgraph.workspace = true
anyhow.workspace = true
cranelift-entity.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true

[dev-dependencies]
# Test-only IR helpers (build_sub_as_add_neg, count_kind, set_call_cc, …).
strider-ir = { workspace = true, features = ["test-util"] }
# `Graph::next_node_id`, used by the peephole's rewrite-bookkeeping test.
strider-graph = { workspace = true, features = ["test-injectors"] }
strider-ir-test-utils = { workspace = true }
object.workspace = true
criterion.workspace = true

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
