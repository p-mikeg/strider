[package]
name = "strider-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Strider's sea-of-nodes intermediate representation."
repository.workspace = true
rust-version.workspace = true

[features]
# Exposes builder/inspection helpers used only by downstream crates' tests
# (e.g. `build_sub_as_add_neg`, `count_kind`, `set_call_cc`). Dev-dep only, so
# production builds never carry them. Mirrors strider-graph's `test-injectors`.
test-util = []

[dependencies]
anyhow.workspace = true
bitflags = "2"
dot.workspace = true
entity-utils.workspace = true
graph-algorithms.workspace = true
petgraph = { workspace = true }
strider-graph.workspace = true
read-only-memory.workspace = true
cranelift-entity.workspace = true
rsleigh.workspace = true
vn-container.workspace = true
strider-target.workspace = true
smallvec.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
proptest = "1"
# Dev-dep cycle is fine: cargo only links dev-deps for `cargo test`, never for
# the regular `cargo build`, so the cycle (test-utils -> ir, ir [dev] ->
# test-utils) is acceptable.  strider-ir's own `#[cfg(test)] mod tests` blocks
# in `src/builder/tests.rs` use SENTINEL_LIFT_ADDR / sp_vn_x86_64 etc., so
# they need the helpers visible at test time.
strider-ir-test-utils = { workspace = true, features = ["proptest-gen"] }
# Enable the test-only use-list corruption injectors (`Graph::corrupt_*`) for
# the validator consistency tests. Dev-dep only, so production strider-ir never
# carries them.
strider-graph = { workspace = true, features = ["test-injectors"] }

[lints]
workspace = true
