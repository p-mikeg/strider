[package]
name = "strider-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Strider's sea-of-nodes intermediate representation."
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Builder and inspection helpers for downstream tests. Absent from the wheel;
# a workspace build unifies it on through strider-ir-test-utils.
test-util = []

[dependencies]
anyhow.workspace = true
bitflags.workspace = true
dot.workspace = true
entity-utils.workspace = true
graph-algorithms.workspace = true
strider-graph.workspace = true
read-only-memory.workspace = true
cranelift-entity.workspace = true
dashu-int.workspace = true
rsleigh.workspace = true
vn-container.workspace = true
strider-target.workspace = true
smallvec.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
expect-test.workspace = true
# `dominator_tree`'s tests check dominance against `simple_fast`.
petgraph = { workspace = true }
proptest.workspace = true
# A dev-dep cycle, which cargo allows.
strider-ir-test-utils = { workspace = true, features = ["proptest-gen"] }
# Use-list corruption injectors and the edge-read counter, for tests.
strider-graph = { workspace = true, features = ["test-injectors", "edge-read-count"] }
strider-target = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
