[package]
name = "strider-ir"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
bitflags = "2"
dot.workspace = true
entity-utils.workspace = true
graphwalk.workspace = true
strider-graph.workspace = true
read-only-memory.workspace = true
cranelift-bitset.workspace = true
cranelift-entity.workspace = true
rsleigh.workspace = true
strider-target.workspace = true
smallvec.workspace = true
thiserror.workspace = true
rustc-hash = "2"

[dev-dependencies]
proptest = "1"
# Dev-dep cycle is fine: cargo only links dev-deps for `cargo test`, never for
# the regular `cargo build`, so the cycle (test-utils -> ir, ir [dev] ->
# test-utils) is acceptable.  strider-ir's own `#[cfg(test)] mod tests` blocks
# in `src/builder/tests.rs` use SENTINEL_LIFT_ADDR / sp_vn_x86_64 etc., so
# they need the helpers visible at test time.
strider-ir-test-utils = { workspace = true }
# Enable the test-only use-list corruption injectors (`Graph::corrupt_*`) for
# the validator consistency tests. Dev-dep only, so production strider-ir never
# carries them.
strider-graph = { workspace = true, features = ["test-injectors"] }

[lints]
workspace = true
