[package]
name = "ir"
version = "0.1.0"
edition.workspace = true

[dependencies]
strider-ir = { workspace = true }

[dev-dependencies]
strider-ir = { workspace = true, features = ["test-utils"] }
target.workspace = true
rsleigh.workspace = true
proptest = "1"
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "validate"
harness = false

[features]
# Forward to strider-ir's test-utils feature for backwards compatibility.
test-utils = ["strider-ir/test-utils"]

[lints]
workspace = true
