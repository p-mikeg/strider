[package]
name = "strider-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The payload-agnostic bipartite sea-of-nodes graph strider builds on."
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
cranelift-entity.workspace = true
hashbrown = { version = "0.16" }
petgraph.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true

[features]
# Test-only graph internals: `Graph::corrupt_clear_first_use`, which breaks a
# use-list on purpose for strider-ir's validator tests, and
# `Graph::next_node_id`, the arena's next unallocated key.
test-injectors = []

[dev-dependencies]
proptest.workspace = true
# `tests/` is an integration test, so `cfg(test)` does not reach the library:
# without this `cargo test -p strider-graph` alone fails to compile, and the
# workspace run hides it by unifying the feature from another crate.
strider-graph = { path = ".", features = ["test-injectors"] }

[lints]
workspace = true
