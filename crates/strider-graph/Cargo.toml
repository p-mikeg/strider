[package]
name = "strider-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The payload-agnostic bipartite sea-of-nodes graph strider builds on."
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
cranelift-entity.workspace = true
hashbrown.workspace = true
smallvec.workspace = true

[features]
# Test-only graph internals: `Graph::corrupt_clear_first_use`, which breaks a
# use-list on purpose for strider-ir's validator tests,
# `Graph::next_node_id`, the arena's next unallocated key, and
# `Graph::remove_node_input`, the single-slot removal.
test-injectors = []
# `edge_reads`: `Inputs` / `InputIter` reads, `nth_input` calls and
# `value_uses` steps on the current thread, the unit strider-ir's
# validate-cost test counts. Enabled only by strider-ir's dev-dependency, so a
# per-package bench, an example and the wheel never pay for it.
edge-read-count = []

[dev-dependencies]
# The producer-before-consumer order the invariant tests check use lists
# against.
graph-algorithms = { workspace = true }
proptest.workspace = true
# `tests/` is an integration test, so `cfg(test)` does not reach the library:
# without this `cargo test -p strider-graph` alone fails to compile, and the
# workspace run hides it by unifying the feature from another crate.
strider-graph = { path = ".", features = ["test-injectors"] }

[lints]
workspace = true
