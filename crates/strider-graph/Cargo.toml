[package]
name = "strider-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The payload-agnostic bipartite sea-of-nodes graph strider builds on."
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
cranelift-entity.workspace = true
hashbrown = { version = "0.16" }
petgraph.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true

[features]
# Test-only use-list corruption injectors (`Graph::corrupt_*`). Gated so
# normal consumers never see these inconsistency-injecting methods; enabled
# by strider-ir's validator consistency tests.
test-injectors = []

[dev-dependencies]
proptest.workspace = true
# `tests/` is an integration test, so `cfg(test)` does not reach the library:
# without this `cargo test -p strider-graph` alone fails to compile, and the
# workspace run hides it by unifying the feature from another crate.
strider-graph = { path = ".", features = ["test-injectors"] }

[lints]
workspace = true
