[package]
name = "strider-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The payload-agnostic bipartite sea-of-nodes graph strider builds on."
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
cranelift-entity.workspace = true
hashbrown.workspace = true
smallvec.workspace = true

[features]
# Test-only internals: `corrupt_clear_first_use`, `next_node_id`,
# `remove_node_input`, `is_cached`.
test-injectors = []
# `edge_reads`: per-thread count of input and use reads, for strider-ir's
# validate-cost test.
edge-read-count = []

[dev-dependencies]
# `acyclic_postorder`, the order the invariant tests check against.
graph-algorithms = { workspace = true, features = ["test-util"] }
proptest.workspace = true
# Gives `tests/` the feature `cfg(test)` cannot reach.
strider-graph = { path = ".", features = ["test-injectors"] }

[lints]
workspace = true
