[package]
name = "strider-analyze"
version = "0.1.0"
edition.workspace = true

[dependencies]
strider-ir = { workspace = true }
# strider-lift forward dep (Phase 3 Task 3.1): the cfg-time mini-IR
# indirect-resolver implementation lives here as a concrete
# `IndirectTargetResolver` impl (see src/indirect_resolver.rs).  Also
# powers the orchestrator (Task 3.1c) via the lifter/region driver
# crates re-exported through strider-lift.
strider-lift = { workspace = true }
# Absorbed from `opt` (Phase 3 Task 3.0).
rsleigh.workspace = true
target.workspace = true
anyhow.workspace = true
cranelift-entity.workspace = true
ethnum.workspace = true
rustc-hash = "2"
smallvec.workspace = true
# Absorbed from `pattern` (Phase 3 Task 3.0).
thiserror.workspace = true
bitflags = "2"
# Egg — value-slice egraph driver, used by the Phase 3 Task 3.2
# `ConstantFoldEgg` rewriter alongside the existing imperative
# `ConstantFold` (parity test in tests/constant_fold_egg_parity.rs).
egg = "0.10"
# Salsa 0.26.2 — Phase 3 Task 3.9 incremental query graph for the
# orchestrator's indirect-branch fixed-point.  Pinned to the same
# version as rust-analyzer / Astral's ruff per the V2 verification.
salsa = "0.26.2"

[dev-dependencies]
reader = { workspace = true }
object.workspace = true
strider-ir = { workspace = true, features = ["test-utils"] }
# Phase 6 Task 6.3 — property-based testing for value-only IR invariants
# under the optimizer (see tests/proptest_optimizer.rs).
proptest = "1"

[lints]
workspace = true
