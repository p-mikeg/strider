# indirect-resolver implementation lives here as a concrete
# `IndirectTargetResolver` impl (see src/indirect_resolver.rs).  The
# previous TEMPORARY back-edge from strider-lift to strider-analyze was
# severed by the callback trait extraction in Task 3.1.
strider-lift = { workspace = true }
# Absorbed from `opt` (Phase 3 Task 3.0).
ir.workspace = true
rsleigh.workspace = true
target.workspace = true
entity-utils.workspace = true
anyhow.workspace = true
cranelift-entity.workspace = true
ethnum.workspace = true
rustc-hash = "2"
smallvec.workspace = true
# Absorbed from `pattern` (Phase 3 Task 3.0).
thiserror.workspace = true
bitflags = "2"

[dev-dependencies]
ir = { workspace = true, features = ["test-utils"] }
# Indirect-resolver tests (moved from cfg/tests/ in Phase 3 Task 3.1)
# need to drive the mini-IR via real Sleigh + types from cfg.
cfg = { workspace = true }

[lints]
workspace = true
