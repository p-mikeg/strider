[package]
name = "strider-analyze"
version = "0.1.0"
edition.workspace = true

[dependencies]
strider-ir = { workspace = true }
entity-utils = { workspace = true }
# strider-lift forward dep: the cfg-time mini-IR indirect-resolver
# implementation lives here as a closure wrapped in
# `strider_lift::cfg::IndirectResolverFn` (see src/indirect_resolver.rs)
# and is installed via `Builder::with_indirect_resolver`.  Also powers
# the orchestrator via the lifter / region driver crates re-exported
# through strider-lift.
strider-lift = { workspace = true }
strider-pattern = { workspace = true }
rsleigh.workspace = true
strider-target.workspace = true
anyhow.workspace = true
cranelift-entity.workspace = true
rustc-hash = "2"
smallvec.workspace = true
thiserror.workspace = true
bitflags = "2"
# `dot` powers the orchestrator's per-region HTML emission
# (`dump_per_region`).  It is also pulled in by every dev-dep test that
# wants to render an IR graph.
dot.workspace = true

[dev-dependencies]
strider-reader = { workspace = true }
object.workspace = true
strider-ir-test-utils = { workspace = true }
expect-test.workspace = true
paste = "1"
insta = { version = "1.40", features = ["yaml"] }
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.7", features = ["html_reports"] }
# Property-based testing for value-only IR invariants
# under the optimizer (see tests/proptest_optimizer.rs).
proptest = "1"

[[bench]]
name = "scaling"
harness = false

[lints]
workspace = true
