[package]
name = "strider-analyze"
version = "0.1.0"
edition.workspace = true

[dependencies]
strider-ir = { workspace = true }
entity-utils = { workspace = true }
# strider-lift forward dep (Phase 3 Task 3.1): the cfg-time mini-IR
# indirect-resolver implementation lives here as a concrete
# `IndirectTargetResolver` impl (see src/indirect_resolver.rs).  Also
# powers the orchestrator (Task 3.1c) via the lifter/region driver
# crates re-exported through strider-lift.
strider-lift = { workspace = true }
# Absorbed from `opt` (Phase 3 Task 3.0).
rsleigh.workspace = true
target.workspace = true
anyhow.workspace = true
cranelift-entity.workspace = true
ethnum.workspace = true
rustc-hash = "2"
smallvec.workspace = true
# Absorbed from `pattern` (Phase 3 Task 3.0).
thiserror.workspace = true
bitflags = "2"

[dev-dependencies]
reader = { workspace = true }
object.workspace = true
strider-ir-test-utils = { workspace = true }
expect-test.workspace = true
paste = "1"
dot.workspace = true
insta = { version = "1.40", features = ["yaml"] }
serde = { version = "1", features = ["derive"] }
# Property-based testing for value-only IR invariants
# under the optimizer (see tests/proptest_optimizer.rs).
proptest = "1"

[lints]
workspace = true
