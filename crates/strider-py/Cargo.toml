[package]
name = "strider-py"
version.workspace = true
edition = { workspace = true }
license.workspace = true
description = "Python bindings for the strider binary-analysis pipeline."
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "README.md"

[lib]
# Not the Python import path; `[tool.maturin] module-name` sets that.
name = "strider_py"
crate-type = ["cdylib"]
# No interpreter to link against; the tests are pytest under `tests/python/`.
test = false
doctest = false

[dependencies]
# `multiple-pymethods`: several pyclasses have more than one `#[pymethods]`
# block (macro-generated).
pyo3 = { version = "0.22", default-features = false, features = ["abi3-py39", "macros", "multiple-pymethods"] }
anyhow = { workspace = true }
# `remaining_stack` only. Never `maybe_grow`: a Python callback on a switched
# stack trips CPython's recursion guard.
stacker = "0.1.25"

strider-orchestrator = { workspace = true }
strider-opt = { workspace = true }
strider-pattern = { workspace = true }
strider-ir = { workspace = true }
strider-cfg = { workspace = true }
dot = { workspace = true }
strider-reader = { workspace = true }
strider-target = { workspace = true }
rsleigh = { workspace = true }
object = { workspace = true }
rustc-hash.workspace = true

[lints]
workspace = true

# `extension-module` keeps libpython out of the cdylib.
[features]
default = ["pyo3/extension-module"]
# Hooks only the pytest suite calls; never in the shipped wheel.
test-hooks = []
