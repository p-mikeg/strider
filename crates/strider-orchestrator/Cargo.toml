[package]
name = "strider-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs strider's lift, optimize and indirect-branch resolution loop."
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
strider-opt = { workspace = true }
strider-ir = { workspace = true }
# strider-cfg: the Cfg `Lifter::build_cfg` returns, plus the address and
# ResolvedTargets types the rebuild fixed-point threads.
strider-cfg = { workspace = true }
# strider-lift: the CFG -> IR lift (lift::Lifter, LiftOptions).
strider-lift = { workspace = true }
rsleigh.workspace = true
strider-target.workspace = true
anyhow.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
strider-reader = { workspace = true }
# Used only by integration tests (pattern queries) and examples (HTML dumps).
strider-pattern = { workspace = true }
dot.workspace = true
entity-utils = { workspace = true }
object.workspace = true
# Test-only IR surface (build_branch, live_snapshot, cc_ret_and_clobber_vns, …).
# The assertion vocabulary (count_kind, has_kind, build_sub_as_add_neg) is in
# strider-ir-test-utils below.
strider-ir = { workspace = true, features = ["test-util"] }
# Test-only single-pass runners (run_one / run_post) used by integration tests.
strider-opt = { workspace = true, features = ["test-util"] }
strider-ir-test-utils = { workspace = true, features = ["proptest-gen"] }
strider-target = { workspace = true, features = ["test-util"] }
paste = "1"
criterion.workspace = true
proptest.workspace = true
dhat = "0.3"

[[bench]]
name = "scaling"
harness = false

[lints]
workspace = true
