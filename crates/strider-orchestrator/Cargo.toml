[package]
name = "strider-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs strider's lift, optimize and indirect-branch resolution loop."
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
strider-opt = { workspace = true }
strider-ir = { workspace = true }
strider-cfg = { workspace = true }
strider-lift = { workspace = true }
rsleigh.workspace = true
strider-target.workspace = true
anyhow.workspace = true
rustc-hash.workspace = true

[features]
# `Strider::analyze_with_classifier`, the classifier seam the loop's tests drive.
test-util = []

[dev-dependencies]
# Self dev-dependency: turns `test-util` on for the `tests/` targets only.
strider-orchestrator = { workspace = true, features = ["test-util"] }
strider-reader = { workspace = true }
# Used only by integration tests (pattern queries) and examples (HTML dumps).
strider-pattern = { workspace = true }
dot.workspace = true
object.workspace = true
# Test-only IR builders.
strider-ir = { workspace = true, features = ["test-util"] }
# `test-util` runners.
strider-opt = { workspace = true, features = ["test-util"] }
strider-ir-test-utils = { workspace = true, features = ["proptest-gen"] }
strider-target = { workspace = true, features = ["test-util"] }
paste = "1"
criterion.workspace = true
# `expect_file!` reads and blesses tests/golden.rs's fixtures/golden/.
expect-test.workspace = true
proptest.workspace = true
dhat = "0.3"

[[bench]]
name = "scaling"
harness = false

[lints]
workspace = true
