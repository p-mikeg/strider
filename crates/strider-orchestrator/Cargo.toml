[package]
name = "strider-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strider-opt = { workspace = true }
strider-ir = { workspace = true }
# strider-cfg: the orchestrator builds the CFG (Builder/Cfg) and threads
# its address + ResolvedTargets types through the rebuild fixed-point.
strider-cfg = { workspace = true }
# strider-lift: the CFG -> IR lift (lift::Lifter, LiftOptions).
strider-lift = { workspace = true }
rsleigh.workspace = true
strider-target.workspace = true
anyhow.workspace = true
rustc-hash = "2"

[dev-dependencies]
strider-reader = { workspace = true }
# Used only by integration tests (pattern queries) and examples (HTML dumps).
strider-pattern = { workspace = true }
dot.workspace = true
entity-utils = { workspace = true }
object.workspace = true
# Test-only IR helpers (count_kind, has_kind, build_sub_as_add_neg, …).
strider-ir = { workspace = true, features = ["test-util"] }
# Test-only single-pass runners (run_one / run_post) used by integration tests.
strider-opt = { workspace = true, features = ["test-util"] }
strider-ir-test-utils = { workspace = true }
paste = "1"
criterion = { version = "0.7", features = ["html_reports"] }
proptest = "1"
dhat = "0.3"

[[bench]]
name = "scaling"
harness = false

[lints]
workspace = true
