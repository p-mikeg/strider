[package]
name = "strider-ir-test-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Function and calling-convention builders shared by strider's test suites."
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `test-util` exposes the build_call_cc / build_call_other_abi convenience
# constructors this crate's `tb.rs` builders use. strider-ir-test-utils is only
# ever a dev-dependency, so this never reaches a production build.
strider-ir = { workspace = true, features = ["test-util"] }
strider-target = { workspace = true }
rsleigh.workspace = true
anyhow.workspace = true

[lints]
workspace = true
