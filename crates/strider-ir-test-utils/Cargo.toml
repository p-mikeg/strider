[package]
name = "strider-ir-test-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Function and calling-convention builders shared by strider's test suites."
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# `test-util` exposes the build_call_cc / build_branch convenience
# constructors this crate's `tb.rs` builders use. This is a NORMAL
# dependency, so a workspace-wide build resolves strider-ir with the feature on;
# only the wheel, which never depends on this crate, resolves it without.
strider-ir = { workspace = true, features = ["test-util"] }
strider-target = { workspace = true }
# `EntityRef::index` for `assert_live_matches_reachable`; `interp`'s value
# maps.
cranelift-entity.workspace = true
# `interp`'s integer carrier, at the declared width.
rsleigh.workspace = true
# `graph_oracle`, re-exported from the `test-util` feature.
graph-algorithms = { workspace = true, features = ["test-util"] }
anyhow.workspace = true
proptest = { workspace = true, optional = true }

[features]
# Gates `proptest_gen`. Off by default so `cargo build --workspace`, which
# builds this crate as a member, does not compile proptest's tree.
proptest-gen = ["dep:proptest"]

[lints]
workspace = true
